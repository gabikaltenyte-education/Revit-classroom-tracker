<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revit Classroom Tracker</title>
    <style>
        :root {
            --color-background-primary: #ffffff;
            --color-background-secondary: #f8f8f8;
            --color-background-tertiary: #f0f0f0;
            --color-background-info: #E6F1FB;
            --color-background-success: #EAF3DE;
            --color-background-warning: #FAEEDA;
            --color-background-danger: #FCEBEB;
            --color-text-primary: #1a1a1a;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-text-info: #185FA5;
            --color-text-success: #3B6D11;
            --color-text-warning: #854F0B;
            --color-text-danger: #A32D2D;
            --color-border-tertiary: rgba(0, 0, 0, 0.15);
            --color-border-secondary: rgba(0, 0, 0, 0.3);
            --color-border-info: #85B7EB;
            --color-border-success: #97C459;
            --color-border-warning: #FAC775;
            --color-border-danger: #F09595;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --color-background-primary: #1a1a1a;
                --color-background-secondary: #2a2a2a;
                --color-background-tertiary: #333333;
                --color-background-info: #0C447C;
                --color-background-success: #27500A;
                --color-background-warning: #633806;
                --color-background-danger: #791F1F;
                --color-text-primary: #ffffff;
                --color-text-secondary: #b3b3b3;
                --color-text-tertiary: #808080;
                --color-text-info: #B5D4F4;
                --color-text-success: #C0DD97;
                --color-text-warning: #FAC775;
                --color-text-danger: #F7C1C1;
                --color-border-tertiary: rgba(255, 255, 255, 0.15);
                --color-border-secondary: rgba(255, 255, 255, 0.3);
                --color-border-info: #378ADD;
                --color-border-success: #639922;
                --color-border-warning: #BA7517;
                --color-border-danger: #E24B4A;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: var(--font-sans); background: var(--color-background-primary); color: var(--color-text-primary); line-height: 1.7; }
        #root { max-width: 1200px; margin: 0 auto; }
        button { font-family: var(--font-sans); font-size: 14px; padding: 8px 16px; border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-secondary); cursor: pointer; transition: all 0.15s; }
        button:hover { background: var(--color-background-secondary); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="text"], input[type="number"], input[type="file"], textarea, select { font-family: var(--font-sans); font-size: 14px; padding: 8px 12px; border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-tertiary); width: 100%; }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--color-border-info); box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.1); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); padding: 1.5rem; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .tab-buttons { display: flex; gap: 8px; border-bottom: 1px solid var(--color-border-tertiary); margin-bottom: 1.5rem; }
        .tab-button { background: transparent; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; cursor: pointer; color: var(--color-text-secondary); }
        .tab-button.active { color: var(--color-text-info); border-bottom-color: var(--color-border-info); }
        .preview-image { max-width: 100%; border-radius: var(--border-radius-md); margin-top: 8px; border: 1px solid var(--color-border-tertiary); }
        .thumbnail { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--color-border-tertiary); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const firebaseConfig = {
    apiKey: "AIzaSyAMqKnPGaBxz78G-1UcpRajsXwaKLBop9U",
    authDomain: "revit-classroom-tracker.firebaseapp.com",
    databaseURL: "https://revit-classroom-tracker-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "revit-classroom-tracker",
    storageBucket: "revit-classroom-tracker.firebasestorage.app",
    messagingSenderId: "721685805575",
    appId: "1:721685805575:web:8ab164a38c5e5f158fc8a2"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const storage = firebase.storage();
const { useState, useEffect } = React;

function App() {
    const [view, setView] = useState('home');
    const [templates, setTemplates] = useState({});
    const [sessions, setSessions] = useState({});
    const [classrooms, setClassrooms] = useState({});
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('session')) setView('student');
    }, []);

    useEffect(() => {
        database.ref('templates').on('value', snap => setTemplates(snap.val() || {}));
        database.ref('sessions').on('value', snap => setSessions(snap.val() || {}));
        database.ref('classrooms').on('value', snap => { setClassrooms(snap.val() || {}); setLoading(false); });
        return () => {
            database.ref('templates').off();
            database.ref('sessions').off();
            database.ref('classrooms').off();
        };
    }, []);

    if (loading) return <div style={{ padding: '2rem', textAlign: 'center' }}>Loading...</div>;

    if (view === 'student') return <StudentView setView={setView} />;
    if (view === 'home') return <HomeView setView={setView} templates={templates} sessions={sessions} classrooms={classrooms} />;
    if (view === 'template') return <TemplateEditor setView={setView} />;
    if (view === 'classroom') return <ClassroomEditor setView={setView} />;
    if (view === 'batch-sessions') return <BatchSessionCreator setView={setView} templates={templates} classrooms={classrooms} />;
    if (view.startsWith('teacher-')) {
        const sessionId = view.substring(8);
        return <TeacherView setView={setView} sessionId={sessionId} />;
    }
    if (view.startsWith('report-')) {
        const sessionId = view.substring(7);
        return <ReportView setView={setView} sessionId={sessionId} sessions={sessions} />;
    }
    return <HomeView setView={setView} templates={templates} sessions={sessions} classrooms={classrooms} />;
}

function HomeView({ setView, templates, sessions, classrooms }) {
    const deleteSession = (sid) => {
        if (confirm('Delete this session?')) database.ref('sessions/' + sid).remove();
    };

    const endSession = (sid) => {
        if (confirm('End this session? Students can still submit screenshots after.')) {
            database.ref('sessions/' + sid + '/active').set(false);
            database.ref('sessions/' + sid + '/endedAt').set(Date.now());
        }
    };

    const deleteTemplate = (tid) => {
        if (confirm('Delete this lecture template? This cannot be undone.')) {
            database.ref('templates/' + tid).remove();
        }
    };

    const deleteClassroom = (cid) => {
        if (confirm('Delete this classroom layout? This cannot be undone.')) {
            database.ref('classrooms/' + cid).remove();
        }
    };

    const activeSessions = Object.entries(sessions).filter(([, s]) => s.active);
    const endedSessions = Object.entries(sessions).filter(([, s]) => !s.active);

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '900px', margin: '0 auto' }}>
                <h1 style={{ fontSize: '28px', fontWeight: '600', margin: '0 0 8px' }}>Classroom Tracker</h1>
                <p style={{ fontSize: '16px', color: 'var(--color-text-secondary)', margin: '0 0 2rem' }}>Manage lectures, classrooms, and sessions</p>

                <div style={{ display: 'grid', gap: '12px', marginBottom: '2rem' }}>
                    <button onClick={() => setView('template')} style={{ padding: '1rem', textAlign: 'left' }}>
                        <div style={{ fontSize: '16px', fontWeight: '500' }}>📚 Create Lecture Template</div>
                        <div style={{ fontSize: '14px', color: 'var(--color-text-secondary)', marginTop: '4px' }}>Define steps and content</div>
                    </button>
                    <button onClick={() => setView('classroom')} style={{ padding: '1rem', textAlign: 'left' }}>
                        <div style={{ fontSize: '16px', fontWeight: '500' }}>🏫 Create Classroom Layout</div>
                        <div style={{ fontSize: '14px', color: 'var(--color-text-secondary)', marginTop: '4px' }}>Define desk arrangements</div>
                    </button>
                    <button onClick={() => setView('batch-sessions')} style={{ padding: '1rem', textAlign: 'left' }}>
                        <div style={{ fontSize: '16px', fontWeight: '500' }}>🚀 Batch Create Sessions</div>
                        <div style={{ fontSize: '14px', color: 'var(--color-text-secondary)', marginTop: '4px' }}>Create multiple sessions at once</div>
                    </button>
                </div>

                {activeSessions.length > 0 && (
                    <>
                        <h2 style={{ fontSize: '20px', fontWeight: '500', margin: '2rem 0 1rem' }}>Active Sessions</h2>
                        <div style={{ display: 'grid', gap: '12px' }}>
                            {activeSessions.map(([sid, session]) => (
                                <div key={sid} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.25rem' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                        <div style={{ flex: 1 }}>
                                            <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 4px' }}>{session.sessionName || session.templateName}</h3>
                                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 8px' }}>
                                                {session.templateName} • {session.classroomName}
                                            </p>
                                            <p style={{ fontSize: '14px', color: 'var(--color-text-tertiary)', margin: '0' }}>
                                                {Object.keys(session.students || {}).length} students
                                            </p>
                                        </div>
                                        <div style={{ display: 'flex', gap: '8px' }}>
                                            <button onClick={() => setView('teacher-' + sid)}>Manage</button>
                                            <button onClick={() => endSession(sid)} style={{ background: 'var(--color-background-warning)', color: 'var(--color-text-warning)' }}>End</button>
                                            <button onClick={() => deleteSession(sid)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>Delete</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}

                {endedSessions.length > 0 && (
                    <>
                        <h2 style={{ fontSize: '20px', fontWeight: '500', margin: '2rem 0 1rem' }}>Past Sessions</h2>
                        <div style={{ display: 'grid', gap: '12px' }}>
                            {endedSessions.map(([sid, session]) => (
                                <div key={sid} style={{ background: 'var(--color-background-tertiary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.25rem', opacity: 0.8 }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                        <div style={{ flex: 1 }}>
                                            <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 4px' }}>{session.sessionName || session.templateName}</h3>
                                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 8px' }}>
                                                {session.templateName} • {session.classroomName}
                                            </p>
                                            <p style={{ fontSize: '14px', color: 'var(--color-text-tertiary)', margin: '0' }}>
                                                Ended {new Date(session.endedAt || session.createdAt).toLocaleString()}
                                            </p>
                                        </div>
                                        <div style={{ display: 'flex', gap: '8px' }}>
                                            <button onClick={() => setView('report-' + sid)}>View Report</button>
                                            <button onClick={() => deleteSession(sid)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>Delete</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}

                {Object.keys(templates).length > 0 && (
                    <>
                        <h2 style={{ fontSize: '20px', fontWeight: '500', margin: '2rem 0 1rem' }}>Lecture Templates</h2>
                        <div style={{ display: 'grid', gap: '8px' }}>
                            {Object.entries(templates).map(([tid, template]) => (
                                <div key={tid} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)', border: '0.5px solid var(--color-border-tertiary)', padding: '1rem' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div>
                                            <div style={{ fontSize: '16px', fontWeight: '500' }}>{template.name}</div>
                                            <div style={{ fontSize: '14px', color: 'var(--color-text-secondary)', marginTop: '4px' }}>
                                                {template.steps?.length || 0} steps
                                            </div>
                                        </div>
                                        <button onClick={() => deleteTemplate(tid)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}

                {Object.keys(classrooms).length > 0 && (
                    <>
                        <h2 style={{ fontSize: '20px', fontWeight: '500', margin: '2rem 0 1rem' }}>Classroom Layouts</h2>
                        <div style={{ display: 'grid', gap: '8px' }}>
                            {Object.entries(classrooms).map(([cid, classroom]) => (
                                <div key={cid} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)', border: '0.5px solid var(--color-border-tertiary)', padding: '1rem' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div>
                                            <div style={{ fontSize: '16px', fontWeight: '500' }}>{classroom.name}</div>
                                            <div style={{ fontSize: '14px', color: 'var(--color-text-secondary)', marginTop: '4px' }}>
                                                {classroom.desks ? `${classroom.desks.length} desks, ${classroom.desks.length * 2} seats` : 'Legacy layout'}
                                            </div>
                                        </div>
                                        <button onClick={() => deleteClassroom(cid)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

function BatchSessionCreator({ setView, templates, classrooms }) {
    const [selectedTemplate, setSelectedTemplate] = useState('');
    const [selectedClassrooms, setSelectedClassrooms] = useState([]);
    const [sessionPrefix, setSessionPrefix] = useState('');

    const createSessions = () => {
        if (!selectedTemplate || selectedClassrooms.length === 0 || !sessionPrefix.trim()) {
            alert('Please select a template, at least one classroom, and enter a session name prefix');
            return;
        }

        const template = templates[selectedTemplate];
        const timestamp = Date.now();

        selectedClassrooms.forEach((classroomId, index) => {
            const classroom = classrooms[classroomId];
            const sessionId = `session_${timestamp}_${index}`;
            const sessionName = `${sessionPrefix} - ${classroom.name}`;

            database.ref('sessions/' + sessionId).set({
                templateId: selectedTemplate,
                templateName: template.name,
                classroomId: classroomId,
                classroomName: classroom.name,
                sessionName: sessionName,
                steps: template.steps,
                layout: classroom,
                active: true,
                createdAt: timestamp + index,
                enabledSteps: [0],
                students: {}
            });
        });

        alert(`Created ${selectedClassrooms.length} sessions!`);
        setView('home');
    };

    const toggleClassroom = (cid) => {
        setSelectedClassrooms(prev =>
            prev.includes(cid) ? prev.filter(id => id !== cid) : [...prev, cid]
        );
    };

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '700px', margin: '0 auto' }}>
                <button onClick={() => setView('home')} style={{ marginBottom: '1rem' }}>← Back</button>
                
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '600', margin: '0 0 8px' }}>Batch Create Sessions</h2>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 2rem' }}>
                        Create multiple sessions with the same lecture but different classroom layouts
                    </p>

                    <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Session Name Prefix</label>
                        <input type="text" value={sessionPrefix} onChange={e => setSessionPrefix(e.target.value)} placeholder="e.g., Week 1 - Monday" />
                        <p style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', margin: '4px 0 0' }}>
                            Each session will be named: "{sessionPrefix} - [Classroom Name]"
                        </p>
                    </div>

                    <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Select Lecture Template</label>
                        <select value={selectedTemplate} onChange={e => setSelectedTemplate(e.target.value)}>
                            <option value="">-- Choose template --</option>
                            {Object.entries(templates).map(([tid, template]) => (
                                <option key={tid} value={tid}>{template.name} ({template.steps?.length || 0} steps)</option>
                            ))}
                        </select>
                    </div>

                    <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '8px' }}>
                            Select Classrooms ({selectedClassrooms.length} selected)
                        </label>
                        <div style={{ display: 'grid', gap: '8px' }}>
                            {Object.entries(classrooms).map(([cid, classroom]) => {
                                const isSelected = selectedClassrooms.includes(cid);
                                return (
                                    <button
                                        key={cid}
                                        onClick={() => toggleClassroom(cid)}
                                        style={{
                                            padding: '1rem',
                                            textAlign: 'left',
                                            background: isSelected ? 'var(--color-background-info)' : 'var(--color-background-secondary)',
                                            color: isSelected ? 'var(--color-text-info)' : 'var(--color-text-primary)',
                                            border: isSelected ? '2px solid var(--color-border-info)' : '0.5px solid var(--color-border-tertiary)'
                                        }}
                                    >
                                        <div style={{ fontSize: '16px', fontWeight: '500' }}>
                                            {isSelected ? '✓ ' : ''}{classroom.name}
                                        </div>
                                        <div style={{ fontSize: '14px', opacity: 0.8, marginTop: '4px' }}>
                                            {classroom.desks ? `${classroom.desks.length} desks, ${classroom.desks.length * 2} seats` : 'Legacy layout'}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <button onClick={createSessions} style={{ width: '100%', padding: '1rem', fontSize: '16px', fontWeight: '500' }} disabled={!selectedTemplate || selectedClassrooms.length === 0 || !sessionPrefix.trim()}>
                        Create {selectedClassrooms.length || 0} Session{selectedClassrooms.length !== 1 ? 's' : ''}
                    </button>
                </div>
            </div>
        </div>
    );
}

function TemplateEditor({ setView }) {
    const [name, setName] = useState('');
    const [steps, setSteps] = useState([{ title: '', description: '', imageUrl: '', properties: [] }]);
    const [uploadingIndex, setUploadingIndex] = useState(null);

    const addStep = () => setSteps([...steps, { title: '', description: '', imageUrl: '', properties: [] }]);
    
    const removeStep = (index) => setSteps(steps.filter((_, i) => i !== index));
    
    const updateStep = (index, field, value) => {
        const newSteps = [...steps];
        newSteps[index][field] = value;
        setSteps(newSteps);
    };

    const addProperty = (stepIndex) => {
        const newSteps = [...steps];
        newSteps[stepIndex].properties = [...(newSteps[stepIndex].properties || []), { key: '', value: '' }];
        setSteps(newSteps);
    };

    const updateProperty = (stepIndex, propIndex, field, value) => {
        const newSteps = [...steps];
        newSteps[stepIndex].properties[propIndex][field] = value;
        setSteps(newSteps);
    };

    const removeProperty = (stepIndex, propIndex) => {
        const newSteps = [...steps];
        newSteps[stepIndex].properties = newSteps[stepIndex].properties.filter((_, i) => i !== propIndex);
        setSteps(newSteps);
    };

    const uploadImage = async (stepIndex, file) => {
        if (!file) return;
        setUploadingIndex(stepIndex);
        try {
            const ref = storage.ref().child(`step-images/${Date.now()}_${file.name}`);
            await ref.put(file);
            const url = await ref.getDownloadURL();
            updateStep(stepIndex, 'imageUrl', url);
        } catch (error) {
            alert('Upload failed: ' + error.message);
        }
        setUploadingIndex(null);
    };

    const saveTemplate = () => {
        if (!name.trim()) return alert('Please enter a template name');
        if (steps.some(s => !s.title.trim())) return alert('All steps must have a title');
        
        database.ref('templates').push({
            name: name.trim(),
            steps,
            createdAt: Date.now()
        });
        setView('home');
    };

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                <button onClick={() => setView('home')} style={{ marginBottom: '1rem' }}>← Back</button>
                
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '600', margin: '0 0 8px' }}>Create Lecture Template</h2>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 2rem' }}>
                        Define steps with screenshots, instructions, and properties
                    </p>

                    <div style={{ marginBottom: '2rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Template Name</label>
                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g., Introduction to Revit" />
                    </div>

                    <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Steps</h3>
                    
                    {steps.map((step, i) => (
                        <div key={i} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.25rem', marginBottom: '1rem' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                <h4 style={{ fontSize: '16px', fontWeight: '500', margin: 0 }}>Step {i + 1}</h4>
                                <button onClick={() => removeStep(i)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>Remove</button>
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Step Title</label>
                                <input type="text" value={step.title} onChange={e => updateStep(i, 'title', e.target.value)} placeholder="e.g., Create a new wall" />
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Instructions</label>
                                <textarea value={step.description} onChange={e => updateStep(i, 'description', e.target.value)} placeholder="Detailed instructions for this step..." />
                            </div>

                            <div style={{ marginBottom: '1rem' }}>
                                <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Reference Screenshot</label>
                                <input type="file" accept="image/*" onChange={e => uploadImage(i, e.target.files[0])} disabled={uploadingIndex === i} />
                                {uploadingIndex === i && <p style={{ fontSize: '12px', color: 'var(--color-text-info)', margin: '4px 0 0' }}>Uploading...</p>}
                                {step.imageUrl && <img src={step.imageUrl} alt="Reference" className="preview-image" />}
                            </div>

                            <div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                    <label style={{ fontSize: '14px', color: 'var(--color-text-secondary)' }}>Properties to Fill</label>
                                    <button onClick={() => addProperty(i)} style={{ fontSize: '12px', padding: '4px 12px' }}>+ Add Property</button>
                                </div>
                                {step.properties?.map((prop, pi) => (
                                    <div key={pi} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr auto', gap: '8px', marginBottom: '8px' }}>
                                        <input type="text" value={prop.key} onChange={e => updateProperty(i, pi, 'key', e.target.value)} placeholder="Property name" />
                                        <input type="text" value={prop.value} onChange={e => updateProperty(i, pi, 'value', e.target.value)} placeholder="Expected value" />
                                        <button onClick={() => removeProperty(i, pi)} style={{ background: 'var(--color-background-danger)', color: 'var(--color-text-danger)' }}>×</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}

                    <button onClick={addStep} style={{ width: '100%', marginBottom: '1rem' }}>+ Add Step</button>
                    <button onClick={saveTemplate} style={{ width: '100%', padding: '1rem', fontSize: '16px', fontWeight: '500' }}>Save Template</button>
                </div>
            </div>
        </div>
    );
}

function ClassroomEditor({ setView }) {
    const [name, setName] = useState('');
    const [desks, setDesks] = useState([]);
    const [gridRows, setGridRows] = useState(6);
    const [gridCols, setGridCols] = useState(8);
    const [teacherDesk, setTeacherDesk] = useState({ x: 360, y: 0 });
    const [nextSeatCode, setNextSeatCode] = useState(1);

    const CW = 120, CH = 90, DW = 108, DH = 76, PAD = 6;

    const addDesk = () => {
        const newDesk = {
            id: desks.length + 1,
            x: 0,
            y: CH,
            seats: [
                { code: String(nextSeatCode).padStart(3, '0') },
                { code: String(nextSeatCode + 1).padStart(3, '0') }
            ]
        };
        setDesks([...desks, newDesk]);
        setNextSeatCode(nextSeatCode + 2);
    };

    const removeDesk = (id) => {
        setDesks(desks.filter(d => d.id !== id));
    };

    const updateDeskPosition = (id, x, y) => {
        setDesks(desks.map(d => d.id === id ? { ...d, x, y } : d));
    };

    const updateTeacherDeskPosition = (x, y) => {
        setTeacherDesk({ x, y });
    };

    const saveClassroom = () => {
        if (!name.trim()) return alert('Please enter a classroom name');
        if (desks.length === 0) return alert('Please add at least one desk');

        database.ref('classrooms').push({
            name: name.trim(),
            desks,
            teacherDesk,
            gridRows,
            gridCols,
            createdAt: Date.now()
        });
        setView('home');
    };

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '1100px', margin: '0 auto' }}>
                <button onClick={() => setView('home')} style={{ marginBottom: '1rem' }}>← Back</button>
                
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '600', margin: '0 0 8px' }}>Create Classroom Layout</h2>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 2rem' }}>
                        Design your classroom by positioning desks exactly as they are in the real room
                    </p>

                    <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Classroom Name</label>
                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g., Room A101" />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr auto', gap: '1rem', marginBottom: '1rem' }}>
                        <div>
                            <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Canvas Rows</label>
                            <input type="number" min="4" max="15" value={gridRows} onChange={e => setGridRows(parseInt(e.target.value) || 6)} />
                        </div>
                        <div>
                            <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Canvas Columns</label>
                            <input type="number" min="4" max="15" value={gridCols} onChange={e => setGridCols(parseInt(e.target.value) || 8)} />
                        </div>
                        <div style={{ alignSelf: 'flex-end' }}>
                            <button onClick={addDesk} style={{ padding: '8px 20px' }}>+ Add Student Desk</button>
                        </div>
                    </div>

                    <div style={{ overflowX: 'auto', marginBottom: '1rem', border: '2px solid var(--color-border-secondary)', borderRadius: 'var(--border-radius-md)' }}>
                        <div style={{ position: 'relative', width: gridCols * CW + 'px', height: gridRows * CH + 'px', background: 'var(--color-background-secondary)', backgroundImage: `linear-gradient(to right, var(--color-border-tertiary) 1px, transparent 1px), linear-gradient(to bottom, var(--color-border-tertiary) 1px, transparent 1px)`, backgroundSize: `${CW}px ${CH}px` }}>
                            
                            {/* Teacher's Desk */}
                            <div 
                                style={{ position: 'absolute', left: teacherDesk.x + 'px', top: teacherDesk.y + 'px', padding: '8px', background: 'var(--color-background-warning)', border: '2px solid var(--color-border-warning)', borderRadius: '6px', cursor: 'move', minWidth: '180px' }} 
                                draggable 
                                onDragEnd={e => {
                                    const rect = e.target.parentElement.getBoundingClientRect();
                                    const x = Math.round((e.clientX - rect.left) / CW) * CW;
                                    const y = Math.round((e.clientY - rect.top) / CH) * CH;
                                    updateTeacherDeskPosition(
                                        Math.max(0, Math.min(x, (gridCols - 2) * CW)), 
                                        Math.max(0, Math.min(y, (gridRows - 1) * CH))
                                    );
                                }}
                            >
                                <div style={{ textAlign: 'center', fontSize: '14px', fontWeight: '600', color: 'var(--color-text-warning)' }}>
                                    🎓 TEACHER'S DESK
                                </div>
                            </div>

                            {/* Student Desks */}
                            {desks.map(desk => (
                                <div 
                                    key={desk.id} 
                                    style={{ position: 'absolute', left: (desk.x + PAD) + 'px', top: (desk.y + PAD) + 'px', width: DW + 'px' }}
                                    draggable
                                    onDragEnd={e => {
                                        const rect = e.target.parentElement.getBoundingClientRect();
                                        const x = Math.round((e.clientX - rect.left - PAD) / CW) * CW;
                                        const y = Math.round((e.clientY - rect.top - PAD) / CH) * CH;
                                        updateDeskPosition(
                                            desk.id,
                                            Math.max(0, Math.min(x, (gridCols - 1) * CW)),
                                            Math.max(0, Math.min(y, (gridRows - 1) * CH))
                                        );
                                    }}
                                >
                                    <div style={{ background: 'var(--color-background-primary)', border: '2px solid var(--color-border-secondary)', borderRadius: '6px', padding: '4px', height: DH + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', cursor: 'move' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                            <p style={{ fontSize: '10px', fontWeight: '600', color: 'var(--color-text-secondary)', margin: '0' }}>Desk {desk.id}</p>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); removeDesk(desk.id); }} 
                                                style={{ fontSize: '12px', padding: '0px 6px', background: 'var(--color-background-danger)', color: 'var(--color-text-danger)', cursor: 'pointer' }}
                                            >
                                                ×
                                            </button>
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '3px' }}>
                                            {desk.seats.map((seat, idx) => (
                                                <div key={idx} style={{ 
                                                    padding: '6px 0', 
                                                    fontSize: '11px', 
                                                    fontWeight: '600', 
                                                    background: 'var(--color-background-info)', 
                                                    color: 'var(--color-text-info)', 
                                                    border: '1px solid var(--color-border-info)', 
                                                    borderRadius: '4px',
                                                    textAlign: 'center'
                                                }}>
                                                    {seat.code}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{ background: 'var(--color-background-info)', border: '1px solid var(--color-border-info)', borderRadius: 'var(--border-radius-md)', padding: '1rem', marginBottom: '1rem' }}>
                        <p style={{ fontSize: '13px', color: 'var(--color-text-info)', margin: '0 0 4px', fontWeight: '500' }}>💡 Instructions:</p>
                        <ul style={{ fontSize: '13px', color: 'var(--color-text-info)', margin: 0, paddingLeft: '20px' }}>
                            <li>Drag desks to position them exactly as in your classroom</li>
                            <li>Each desk has 2 seats with unique codes (001, 002, etc.)</li>
                            <li>Students will select their seat by code when joining</li>
                            <li>Position the teacher's desk where it actually is in the room</li>
                        </ul>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1rem', marginBottom: '1.5rem', padding: '1rem', background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)' }}>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: '0' }}>Student Desks</p>
                            <p style={{ fontSize: '24px', fontWeight: '600', margin: '4px 0 0' }}>{desks.length}</p>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: '0' }}>Total Seats</p>
                            <p style={{ fontSize: '24px', fontWeight: '600', margin: '4px 0 0' }}>{desks.length * 2}</p>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: '0' }}>Next Code</p>
                            <p style={{ fontSize: '24px', fontWeight: '600', margin: '4px 0 0' }}>{String(nextSeatCode).padStart(3, '0')}</p>
                        </div>
                    </div>

                    <button onClick={saveClassroom} style={{ width: '100%', padding: '1rem', fontSize: '16px', fontWeight: '500' }}>
                        Save Classroom Layout
                    </button>
                </div>
            </div>
        </div>
    );
}

function TeacherView({ setView, sessionId }) {
    const [session, setSession] = useState(null);
    const [students, setStudents] = useState({});
    const [qrModal, setQrModal] = useState(false);

    useEffect(() => {
        database.ref('sessions/' + sessionId).on('value', snap => setSession(snap.val()));
        database.ref('sessions/' + sessionId + '/students').on('value', snap => setStudents(snap.val() || {}));
        return () => {
            database.ref('sessions/' + sessionId).off();
            database.ref('sessions/' + sessionId + '/students').off();
        };
    }, [sessionId]);

    useEffect(() => {
        if (qrModal) {
            setTimeout(() => {
                const el = document.getElementById('qrcode');
                if (el) {
                    el.innerHTML = '';
                    new QRCode(el, {
                        text: window.location.origin + window.location.pathname + '?session=' + sessionId,
                        width: 256,
                        height: 256
                    });
                }
            }, 100);
        }
    }, [qrModal, sessionId]);

    if (!session) return <div style={{ padding: '2rem', textAlign: 'center' }}>Loading...</div>;

    const toggleStep = (stepIndex) => {
        const enabled = session.enabledSteps || [0];
        const newEnabled = enabled.includes(stepIndex) 
            ? enabled.filter(i => i !== stepIndex)
            : [...enabled, stepIndex].sort((a, b) => a - b);
        database.ref('sessions/' + sessionId + '/enabledSteps').set(newEnabled);
    };

    const enableAllSteps = () => {
        const allSteps = session.steps.map((_, i) => i);
        database.ref('sessions/' + sessionId + '/enabledSteps').set(allSteps);
    };

    const resetHands = () => {
        Object.keys(students).forEach(deskId => {
            database.ref('sessions/' + sessionId + '/students/' + deskId + '/handRaised').set(false);
        });
    };

    const studentsWithHands = Object.entries(students).filter(([, s]) => s.handRaised);

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
                <button onClick={() => setView('home')} style={{ marginBottom: '1rem' }}>← Back to Home</button>

                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem', marginBottom: '1rem' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '600', margin: '0 0 8px' }}>{session.sessionName || session.templateName}</h2>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 1rem' }}>
                        {session.templateName} • {session.classroomName}
                    </p>
                    <div style={{ display: 'flex', gap: '8px' }}>
                        <button onClick={() => setQrModal(true)}>Show QR Code</button>
                        <button onClick={enableAllSteps}>Enable All Steps</button>
                        <button onClick={resetHands}>Reset All Hands</button>
                    </div>
                </div>

                {studentsWithHands.length > 0 && (
                    <div style={{ background: 'var(--color-background-warning)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-warning)', padding: '1.25rem', marginBottom: '1rem' }}>
                        <h3 style={{ fontSize: '16px', fontWeight: '500', color: 'var(--color-text-warning)', margin: '0 0 8px' }}>
                            Raised Hands ({studentsWithHands.length})
                        </h3>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                            {studentsWithHands.map(([deskId, student]) => (
                                <span key={deskId} style={{ padding: '6px 12px', background: 'var(--color-background-primary)', borderRadius: '6px', fontSize: '14px' }}>
                                    ✋ {student.name}
                                </span>
                            ))}
                        </div>
                    </div>
                )}

                <div className="tab-buttons">
                    <button className="tab-button active">Classroom View</button>
                </div>

                <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Classroom Layout</h3>
                <div style={{ marginBottom: '2rem', overflowX: 'auto' }}>
                    <div style={{ position: 'relative', width: ((session.layout.gridCols || 8) * 120) + 'px', height: ((session.layout.gridRows || 6) * 90) + 'px', background: 'var(--color-background-secondary)', backgroundImage: `linear-gradient(to right, var(--color-border-tertiary) 1px, transparent 1px), linear-gradient(to bottom, var(--color-border-tertiary) 1px, transparent 1px)`, backgroundSize: '120px 90px', borderRadius: 'var(--border-radius-md)', border: '0.5px solid var(--color-border-tertiary)' }}>
                        
                        {/* Teacher's Desk */}
                        {session.layout.teacherDesk && (
                            <div style={{ position: 'absolute', left: session.layout.teacherDesk.x + 'px', top: session.layout.teacherDesk.y + 'px', padding: '12px', background: 'var(--color-background-warning)', border: '2px solid var(--color-border-warning)', borderRadius: '6px', minWidth: '180px' }}>
                                <div style={{ textAlign: 'center', fontSize: '13px', fontWeight: '600', color: 'var(--color-text-warning)' }}>
                                    🎓 TEACHER'S DESK
                                </div>
                            </div>
                        )}

                        {/* Student Desks */}
                        {session.layout.desks?.map(desk => (
                            <div key={desk.id} style={{ position: 'absolute', left: (desk.x + 6) + 'px', top: (desk.y + 6) + 'px', width: '108px' }}>
                                <div style={{ background: 'var(--color-background-primary)', border: '1px solid var(--color-border-secondary)', borderRadius: '6px', padding: '6px', height: '70px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                                    <p style={{ fontSize: '10px', fontWeight: '600', color: 'var(--color-text-secondary)', margin: '0', paddingLeft: '2px' }}>Desk {desk.id}</p>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '4px' }}>
                                        {desk.seats.map((seat, idx) => {
                                            const student = students[seat.code];
                                            const completed = student ? (student.completedSteps || []).length : 0;
                                            const total = session.steps.length;
                                            const progress = total > 0 && student ? Math.round((completed / total) * 100) : 0;
                                            return (
                                                <div key={idx} style={{ 
                                                    background: student ? (student.handRaised ? 'var(--color-background-warning)' : 'var(--color-background-info)') : 'var(--color-background-tertiary)', 
                                                    border: '0.5px solid var(--color-border-tertiary)', 
                                                    borderRadius: '4px', 
                                                    padding: '4px 2px', 
                                                    minHeight: '28px', 
                                                    display: 'flex', 
                                                    flexDirection: 'column', 
                                                    justifyContent: 'center', 
                                                    alignItems: 'center' 
                                                }}>
                                                    {student ? (
                                                        <>
                                                            <p style={{ fontSize: '9px', fontWeight: '600', margin: '0', textAlign: 'center', lineHeight: 1.2, color: student.handRaised ? 'var(--color-text-warning)' : 'var(--color-text-info)' }}>
                                                                {student.handRaised && '✋ '}{student.name.length > 10 ? student.name.substring(0, 10) + '...' : student.name}
                                                            </p>
                                                            <p style={{ fontSize: '8px', color: student.handRaised ? 'var(--color-text-warning)' : 'var(--color-text-info)', margin: '2px 0 0', fontWeight: '600' }}>
                                                                {progress}%
                                                            </p>
                                                        </>
                                                    ) : (
                                                        <p style={{ fontSize: '10px', color: 'var(--color-text-tertiary)', margin: 0, fontWeight: '600' }}>{seat.code}</p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem' }}>
                    <div>
                        <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Steps</h3>
                        <div style={{ display: 'grid', gap: '12px' }}>
                            {session.steps.map((step, i) => {
                                const enabled = (session.enabledSteps || [0]).includes(i);
                                const completionCount = Object.values(students).filter(s => (s.completedSteps || []).includes(i)).length;
                                return (
                                    <div key={i} style={{ background: enabled ? 'var(--color-background-primary)' : 'var(--color-background-tertiary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1rem' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                                            <div>
                                                <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0' }}>Step {i + 1}</p>
                                                <p style={{ fontSize: '16px', fontWeight: '500', margin: '4px 0 0' }}>{step.title || step}</p>
                                            </div>
                                            <button onClick={() => toggleStep(i)} style={{ background: enabled ? 'var(--color-background-success)' : 'var(--color-background-secondary)', color: enabled ? 'var(--color-text-success)' : 'var(--color-text-primary)' }}>
                                                {enabled ? 'Enabled' : 'Enable'}
                                            </button>
                                        </div>
                                        <p style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', margin: 0 }}>
                                            {completionCount}/{Object.keys(students).length} completed
                                        </p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div>
                        <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Students ({Object.keys(students).length})</h3>
                        <div style={{ display: 'grid', gap: '8px' }}>
                            {Object.entries(students).map(([deskId, student]) => {
                                const completed = (student.completedSteps || []).length;
                                const total = session.steps.length;
                                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                                return (
                                    <div key={deskId} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)', border: '0.5px solid var(--color-border-tertiary)', padding: '1rem' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                            <div>
                                                <p style={{ fontSize: '16px', fontWeight: '500', margin: '0' }}>
                                                    {student.handRaised && '✋ '}{student.name}
                                                </p>
                                                <p style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', margin: '4px 0 0' }}>
                                                    Seat {deskId}
                                                </p>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <p style={{ fontSize: '20px', fontWeight: '600', margin: 0 }}>{progress}%</p>
                                                <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: 0 }}>{completed}/{total}</p>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>

            {qrModal && (
                <div className="modal-overlay" onClick={() => setQrModal(false)}>
                    <div className="modal" onClick={e => e.stopPropagation()} style={{ textAlign: 'center' }}>
                        <h3 style={{ fontSize: '20px', fontWeight: '500', margin: '0 0 1rem' }}>Student Access</h3>
                        <div id="qrcode" style={{ display: 'inline-block', marginBottom: '1rem' }}></div>
                        <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 1rem', wordBreak: 'break-all' }}>
                            {window.location.origin + window.location.pathname + '?session=' + sessionId}
                        </p>
                        <button onClick={() => setQrModal(false)}>Close</button>
                    </div>
                </div>
            )}
        </div>
    );
}

function ReportView({ setView, sessionId, sessions }) {
    const [session, setSession] = useState(null);
    const [students, setStudents] = useState({});

    useEffect(() => {
        const sess = sessions[sessionId];
        setSession(sess);
        setStudents(sess?.students || {});
    }, [sessionId, sessions]);

    if (!session) return <div style={{ padding: '2rem', textAlign: 'center' }}>Loading...</div>;

    const studentList = Object.entries(students).map(([deskId, student]) => ({
        deskId,
        ...student,
        completedCount: (student.completedSteps || []).length,
        progress: session.steps.length > 0 ? Math.round(((student.completedSteps || []).length / session.steps.length) * 100) : 0
    })).sort((a, b) => b.completedCount - a.completedCount);

    const downloadCSV = () => {
        const headers = ['Name', 'Seat', 'Steps Completed', 'Progress %', ...session.steps.map((s, i) => `Step ${i + 1}`)];
        const rows = studentList.map(s => [
            s.name,
            s.deskId,
            s.completedCount,
            s.progress,
            ...session.steps.map((_, i) => (s.completedSteps || []).includes(i) ? 'Yes' : 'No')
        ]);
        const csv = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report_${session.sessionName || session.templateName}_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
    };

    return (
        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
                <button onClick={() => setView('home')} style={{ marginBottom: '1rem' }}>← Back</button>

                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem', marginBottom: '1.5rem' }}>
                    <h2 style={{ fontSize: '24px', fontWeight: '600', margin: '0 0 8px' }}>Session Report</h2>
                    <p style={{ fontSize: '16px', color: 'var(--color-text-secondary)', margin: '0 0 1rem' }}>
                        {session.sessionName || session.templateName}
                    </p>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-tertiary)', margin: '0 0 1.5rem' }}>
                        {session.templateName} • {session.classroomName} • Ended {new Date(session.endedAt || session.createdAt).toLocaleString()}
                    </p>
                    <button onClick={downloadCSV}>Download CSV Report</button>
                </div>

                <div style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem', marginBottom: '1.5rem' }}>
                    <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Summary</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem' }}>
                        <div>
                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: 0 }}>Total Students</p>
                            <p style={{ fontSize: '28px', fontWeight: '600', margin: '4px 0 0' }}>{studentList.length}</p>
                        </div>
                        <div>
                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: 0 }}>Total Steps</p>
                            <p style={{ fontSize: '28px', fontWeight: '600', margin: '4px 0 0' }}>{session.steps.length}</p>
                        </div>
                        <div>
                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: 0 }}>Avg Completion</p>
                            <p style={{ fontSize: '28px', fontWeight: '600', margin: '4px 0 0' }}>
                                {studentList.length > 0 ? Math.round(studentList.reduce((sum, s) => sum + s.progress, 0) / studentList.length) : 0}%
                            </p>
                        </div>
                    </div>
                </div>

                <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '0 0 1rem' }}>Student Participation</h3>
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', overflow: 'hidden' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                        <thead>
                            <tr style={{ background: 'var(--color-background-secondary)' }}>
                                <th style={{ padding: '1rem', textAlign: 'left', fontSize: '14px', fontWeight: '500' }}>Student</th>
                                <th style={{ padding: '1rem', textAlign: 'left', fontSize: '14px', fontWeight: '500' }}>Seat</th>
                                <th style={{ padding: '1rem', textAlign: 'right', fontSize: '14px', fontWeight: '500' }}>Progress</th>
                                <th style={{ padding: '1rem', textAlign: 'left', fontSize: '14px', fontWeight: '500' }}>Completed Steps</th>
                            </tr>
                        </thead>
                        <tbody>
                            {studentList.map(student => (
                                <tr key={student.deskId} style={{ borderTop: '0.5px solid var(--color-border-tertiary)' }}>
                                    <td style={{ padding: '1rem', fontSize: '14px' }}>{student.name}</td>
                                    <td style={{ padding: '1rem', fontSize: '14px', color: 'var(--color-text-secondary)' }}>{student.deskId}</td>
                                    <td style={{ padding: '1rem', textAlign: 'right' }}>
                                        <span style={{ fontSize: '16px', fontWeight: '500' }}>{student.progress}%</span>
                                        <span style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', marginLeft: '8px' }}>
                                            ({student.completedCount}/{session.steps.length})
                                        </span>
                                    </td>
                                    <td style={{ padding: '1rem' }}>
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                                            {session.steps.map((_, i) => (
                                                <span key={i} style={{
                                                    width: '24px',
                                                    height: '24px',
                                                    display: 'inline-flex',
                                                    alignItems: 'center',
                                                    justifyContent: 'center',
                                                    borderRadius: '4px',
                                                    fontSize: '11px',
                                                    fontWeight: '600',
                                                    background: (student.completedSteps || []).includes(i) ? 'var(--color-background-success)' : 'var(--color-background-tertiary)',
                                                    color: (student.completedSteps || []).includes(i) ? 'var(--color-text-success)' : 'var(--color-text-tertiary)'
                                                }}>
                                                    {i + 1}
                                                </span>
                                            ))}
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                {Object.values(students).some(s => s.screenshots && Object.keys(s.screenshots).length > 0) && (
                    <>
                        <h3 style={{ fontSize: '18px', fontWeight: '500', margin: '2rem 0 1rem' }}>Student Submissions</h3>
                        <div style={{ display: 'grid', gap: '1rem' }}>
                            {Object.entries(students).filter(([, s]) => s.screenshots && Object.keys(s.screenshots).length > 0).map(([deskId, student]) => (
                                <div key={deskId} style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.25rem' }}>
                                    <h4 style={{ fontSize: '16px', fontWeight: '500', margin: '0 0 1rem' }}>{student.name} (Seat {deskId})</h4>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: '12px' }}>
                                        {Object.entries(student.screenshots || {}).map(([stepId, url]) => (
                                            <div key={stepId}>
                                                <a href={url} target="_blank" rel="noopener noreferrer">
                                                    <img src={url} alt={`Step ${parseInt(stepId) + 1}`} className="thumbnail" />
                                                </a>
                                                <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: '4px 0 0', textAlign: 'center' }}>
                                                    Step {parseInt(stepId) + 1}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </>
                )}
            </div>
        </div>
    );
}

function StudentView({ setView }) {
    const [sessionId, setSessionId] = useState('');
    const [session, setSession] = useState(null);
    const [students, setStudents] = useState({});
    const [myDesk, setMyDesk] = useState(null);
    const [name, setName] = useState('');
    const [selectedDesk, setSelectedDesk] = useState('');
    const [uploadingStep, setUploadingStep] = useState(null);
    const [imageModal, setImageModal] = useState(null);

    useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const sid = params.get('session');
        if (sid) setSessionId(sid);
    }, []);

    useEffect(() => {
        if (!sessionId) return;
        database.ref('sessions/' + sessionId).on('value', snap => setSession(snap.val()));
        database.ref('sessions/' + sessionId + '/students').on('value', snap => setStudents(snap.val() || {}));
        const savedDesk = localStorage.getItem('myDesk_' + sessionId);
        if (savedDesk) setMyDesk(savedDesk);
        return () => {
            database.ref('sessions/' + sessionId).off();
            database.ref('sessions/' + sessionId + '/students').off();
        };
    }, [sessionId]);

    const joinSession = () => {
        if (!name.trim() || !selectedDesk) return alert('Enter your name and select a seat');
        database.ref('sessions/' + sessionId + '/students/' + selectedDesk).set({
            name: name.trim(),
            joinedAt: Date.now(),
            completedSteps: [],
            handRaised: false
        });
        localStorage.setItem('myDesk_' + sessionId, selectedDesk);
        setMyDesk(selectedDesk);
    };

    const markDone = (stepIndex) => {
        const completed = students[myDesk]?.completedSteps || [];
        if (!completed.includes(stepIndex)) {
            database.ref('sessions/' + sessionId + '/students/' + myDesk + '/completedSteps').set([...completed, stepIndex].sort((a, b) => a - b));
        }
    };

    const toggleHand = () => {
        const current = students[myDesk]?.handRaised || false;
        database.ref('sessions/' + sessionId + '/students/' + myDesk + '/handRaised').set(!current);
    };

    const uploadScreenshot = async (stepIndex, file) => {
        if (!file) return;
        setUploadingStep(stepIndex);
        try {
            const ref = storage.ref().child(`submissions/${sessionId}/${myDesk}/${stepIndex}_${Date.now()}_${file.name}`);
            await ref.put(file);
            const url = await ref.getDownloadURL();
            database.ref('sessions/' + sessionId + '/students/' + myDesk + '/screenshots/' + stepIndex).set(url);
        } catch (error) {
            alert('Upload failed: ' + error.message);
        }
        setUploadingStep(null);
    };

    if (!sessionId || !session) {
        return (
            <div style={{ padding: '2rem 0', textAlign: 'center' }}>
                <p style={{ color: 'var(--color-text-secondary)' }}>No active session. Use the link from your teacher.</p>
                <button onClick={() => setView('home')} style={{ marginTop: '1rem' }}>Back</button>
            </div>
        );
    }

    if (!myDesk) {
        const CW = 120, CH = 90, DW = 108, DH = 76, PAD = 6;
        return (
            <div style={{ padding: '2rem 0' }}>
                <div style={{ maxWidth: '700px', margin: '0 auto', background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem' }}>
                    <h2 style={{ fontSize: '20px', fontWeight: '500', margin: '0 0 8px' }}>Join Session</h2>
                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 1.5rem' }}>{session.sessionName || session.templateName}</p>
                    
                    <div style={{ marginBottom: '1rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Your Name</label>
                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Enter your name" />
                    </div>
                    
                    <div style={{ marginBottom: '1.5rem' }}>
                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>Select Your Seat</label>
                        <div style={{ overflowX: 'auto', borderRadius: 'var(--border-radius-md)', border: '0.5px solid var(--color-border-tertiary)' }}>
                            <div style={{ position: 'relative', width: ((session.layout.gridCols || 8) * CW) + 'px', height: ((session.layout.gridRows || 6) * CH) + 'px', background: 'var(--color-background-secondary)', backgroundImage: `linear-gradient(to right, var(--color-border-tertiary) 1px, transparent 1px), linear-gradient(to bottom, var(--color-border-tertiary) 1px, transparent 1px)`, backgroundSize: `${CW}px ${CH}px` }}>
                                
                                {/* Teacher's Desk */}
                                {session.layout.teacherDesk && (
                                    <div style={{ position: 'absolute', left: session.layout.teacherDesk.x + 'px', top: session.layout.teacherDesk.y + 'px', padding: '12px', background: 'var(--color-background-warning)', border: '2px solid var(--color-border-warning)', borderRadius: '6px', minWidth: '180px' }}>
                                        <div style={{ textAlign: 'center', fontSize: '12px', fontWeight: '600', color: 'var(--color-text-warning)' }}>
                                            🎓 TEACHER
                                        </div>
                                    </div>
                                )}

                                {/* Student Desks */}
                                {session.layout.desks?.map(desk => (
                                    <div key={desk.id} style={{ position: 'absolute', left: (desk.x + PAD) + 'px', top: (desk.y + PAD) + 'px', width: DW + 'px' }}>
                                        <div style={{ background: 'var(--color-background-primary)', border: '1px solid var(--color-border-secondary)', borderRadius: '6px', padding: '4px', height: (DH - PAD) + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                                            <p style={{ fontSize: '10px', fontWeight: '600', color: 'var(--color-text-secondary)', margin: '0', paddingLeft: '2px' }}>Desk {desk.id}</p>
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '3px' }}>
                                                {desk.seats.map((seat, idx) => {
                                                    const taken = !!students[seat.code];
                                                    const sel = selectedDesk === seat.code;
                                                    return (
                                                        <button 
                                                            key={idx} 
                                                            onClick={() => !taken && setSelectedDesk(seat.code)} 
                                                            disabled={taken}
                                                            style={{ 
                                                                padding: '5px 0', 
                                                                fontSize: '11px', 
                                                                fontWeight: '600', 
                                                                background: taken ? 'var(--color-background-tertiary)' : (sel ? 'var(--color-background-info)' : 'var(--color-background-secondary)'), 
                                                                color: sel ? 'var(--color-text-info)' : (taken ? 'var(--color-text-tertiary)' : 'var(--color-text-primary)'), 
                                                                border: sel ? '2px solid var(--color-border-info)' : '0.5px solid var(--color-border-tertiary)', 
                                                                borderRadius: '4px', 
                                                                cursor: taken ? 'not-allowed' : 'pointer' 
                                                            }}
                                                        >
                                                            {taken ? '×' : seat.code}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <p style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', margin: '8px 0 0' }}>
                            Click on your seat code. × means the seat is taken.
                        </p>
                    </div>
                    
                    <button onClick={joinSession} style={{ width: '100%' }} disabled={!name.trim() || !selectedDesk}>
                        Join Session
                    </button>
                </div>
            </div>
        );
    }

    const student = students[myDesk];
    if (!student) return <div style={{ padding: '2rem', textAlign: 'center' }}>Connecting...</div>;

    const completedSteps = student.completedSteps || [];
    const enabledSteps = session.enabledSteps || [0];
    const canSubmit = !session.active;

    return (
