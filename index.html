        <div style={{ padding: '2rem 0' }}>
            <div style={{ maxWidth: '600px', margin: '0 auto' }}>
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1.5rem', marginBottom: '12px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                        <div>
                            <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0' }}>
                                Seat {myDesk}
                            </p>
                            <p style={{ fontSize: '18px', fontWeight: '500', margin: '4px 0 0' }}>{student.name}</p>
                        </div>
                        {session.active && (
                            <button onClick={toggleHand} style={{ background: student.handRaised ? 'var(--color-background-warning)' : 'var(--color-background-secondary)', color: student.handRaised ? 'var(--color-text-warning)' : 'var(--color-text-primary)' }}>
                                {student.handRaised ? '✋ Lower Hand' : 'Raise Hand'}
                            </button>
                        )}
                    </div>
                    <div style={{ borderTop: '0.5px solid var(--color-border-tertiary)', paddingTop: '1rem' }}>
                        <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0' }}>
                            Progress: {completedSteps.length}/{session.steps.length} steps
                        </p>
                        {!session.active && (
                            <p style={{ fontSize: '14px', color: 'var(--color-text-warning)', margin: '8px 0 0' }}>
                                Session ended. You can still submit screenshots below.
                            </p>
                        )}
                    </div>
                </div>

                <div style={{ display: 'grid', gap: '12px' }}>
                    {session.steps.map((step, i) => {
                        const enabled = enabledSteps.includes(i);
                        const completed = completedSteps.includes(i);
                        const hasScreenshot = student.screenshots?.[i];
                        const stepData = typeof step === 'string' ? { title: step } : step;

                        return (
                            <div key={i} style={{ background: completed ? 'var(--color-background-success)' : (enabled ? 'var(--color-background-primary)' : 'var(--color-background-tertiary)'), borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-tertiary)', padding: '1rem 1.25rem', opacity: enabled || !session.active ? 1 : 0.5 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: stepData.description || stepData.imageUrl || (stepData.properties && stepData.properties.length > 0) ? '1rem' : 0 }}>
                                    <div style={{ flex: 1 }}>
                                        <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0' }}>Step {i + 1}</p>
                                        <p style={{ fontSize: '16px', fontWeight: '500', margin: '4px 0 0' }}>{stepData.title}</p>
                                    </div>
                                    {enabled && session.active && (
                                        <button onClick={() => markDone(i)} disabled={completed} style={{ background: completed ? 'var(--color-background-success)' : 'var(--color-background-primary)', color: completed ? 'var(--color-text-success)' : 'var(--color-text-primary)' }}>
                                            {completed ? '✓ Done' : 'Mark Done'}
                                        </button>
                                    )}
                                </div>

                                {stepData.description && (
                                    <p style={{ fontSize: '14px', color: 'var(--color-text-secondary)', margin: '0 0 1rem', whiteSpace: 'pre-line' }}>
                                        {stepData.description}
                                    </p>
                                )}

                                {stepData.imageUrl && (
                                    <div style={{ marginBottom: '1rem' }}>
                                        <img src={stepData.imageUrl} alt="Reference" className="preview-image" onClick={() => setImageModal(stepData.imageUrl)} style={{ cursor: 'pointer' }} />
                                    </div>
                                )}

                                {stepData.properties && stepData.properties.length > 0 && (
                                    <div style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)', padding: '12px', marginBottom: '1rem' }}>
                                        <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', margin: '0 0 8px', fontWeight: '500' }}>
                                            Properties to fill:
                                        </p>
                                        {stepData.properties.map((prop, pi) => (
                                            <div key={pi} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '14px', margin: '4px 0' }}>
                                                <span style={{ color: 'var(--color-text-secondary)' }}>{prop.key}:</span>
                                                <span style={{ fontWeight: '500' }}>{prop.value}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {canSubmit && (
                                    <div style={{ borderTop: '0.5px solid var(--color-border-tertiary)', paddingTop: '1rem', marginTop: stepData.description || stepData.imageUrl || (stepData.properties && stepData.properties.length > 0) ? 0 : '1rem' }}>
                                        <label style={{ display: 'block', fontSize: '14px', color: 'var(--color-text-secondary)', marginBottom: '6px' }}>
                                            Submit your work
                                        </label>
                                        {hasScreenshot ? (
                                            <div>
                                                <img src={hasScreenshot} alt="Your submission" className="thumbnail" onClick={() => setImageModal(hasScreenshot)} style={{ marginBottom: '8px' }} />
                                                <input type="file" accept="image/*" onChange={e => uploadScreenshot(i, e.target.files[0])} disabled={uploadingStep === i} />
                                                {uploadingStep === i && <p style={{ fontSize: '12px', color: 'var(--color-text-info)', margin: '4px 0 0' }}>Uploading...</p>}
                                            </div>
                                        ) : (
                                            <>
                                                <input type="file" accept="image/*" onChange={e => uploadScreenshot(i, e.target.files[0])} disabled={uploadingStep === i} />
                                                {uploadingStep === i && <p style={{ fontSize: '12px', color: 'var(--color-text-info)', margin: '4px 0 0' }}>Uploading...</p>}
                                            </>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            </div>

            {imageModal && (
                <div className="modal-overlay" onClick={() => setImageModal(null)}>
                    <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: '90vw' }}>
                        <img src={imageModal} alt="Full size" style={{ width: '100%', borderRadius: 'var(--border-radius-md)' }} />
                        <button onClick={() => setImageModal(null)} style={{ marginTop: '1rem', width: '100%' }}>Close</button>
                    </div>
                </div>
            )}
        </div>
    );
}

root.render(<App />);
